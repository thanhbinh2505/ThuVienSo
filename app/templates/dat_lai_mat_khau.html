{% extends 'layout/base.html' %}

{% block title %}Đặt lại mật khẩu{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center pt-20 px-6 bg-gray-50">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <div class="text-center mb-8">

            <div class="w-14 h-14 mx-auto mb-4 bg-blue-50 rounded-full flex items-center justify-center">
                <i data-lucide="lock-keyhole" class="w-7 h-7 text-primary"></i>
            </div>

            <h1 class="text-2xl font-bold text-gray-900">
                Đặt lại mật khẩu
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Hãy nhập mật khẩu mới cho tài khoản của bạn.
            </p>

        </div>


        {% if error %}
        <div class="mb-5 p-3 bg-red-50 border border-red-200 rounded-xl">

            <p class="text-sm text-red-600">
                {{ error }}
            </p>

        </div>
        {% endif %}


        <form method="POST" class="space-y-5">

            <!-- Mật khẩu mới -->
            <div>

                <label for="password"
                       class="block text-sm font-medium text-gray-700 mb-2">

                    Mật khẩu mới

                </label>

                <div class="relative">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                        class="block w-full px-4 py-3 pr-12 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"
                        placeholder="Nhập mật khẩu mới"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="absolute inset-y-0 right-0 px-4 text-gray-400"
                    >
                        <i
                            id="eyeIcon"
                            data-lucide="eye"
                            class="w-5 h-5"
                        ></i>
                    </button>

                </div>

            </div>


            <!-- Xác nhận mật khẩu -->
            <div>

                <label for="confirm_password"
                       class="block text-sm font-medium text-gray-700 mb-2">

                    Xác nhận mật khẩu

                </label>

                <div class="relative">

                    <input
                        id="confirm_password"
                        name="confirm_password"
                        type="password"
                        required
                        class="block w-full px-4 py-3 pr-12 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"
                        placeholder="Nhập lại mật khẩu mới"
                    >

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="absolute inset-y-0 right-0 px-4 text-gray-400"
                    >
                        <i
                            id="eyeConfirmIcon"
                            data-lucide="eye"
                            class="w-5 h-5"
                        ></i>
                    </button>

                </div>

            </div>


            <!-- Nút cập nhật -->

            <button
                type="submit"
                class="w-full py-3.5 rounded-xl text-white font-semibold bg-primary hover:bg-primaryHover transition-all"
            >
                Đặt lại mật khẩu
            </button>

        </form>


        <div class="mt-6 text-center">

            <a
                href="{{ url_for('login_process') }}"
                class="text-sm font-medium text-primary hover:text-primaryHover"
            >
                ← Quay lại đăng nhập
            </a>

        </div>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm_password");

    const togglePassword = document.getElementById("togglePassword");
    const toggleConfirmPassword = document.getElementById(
        "toggleConfirmPassword"
    );


    // Hiện / ẩn mật khẩu mới

    togglePassword.addEventListener("click", function () {

        const type =
            password.type === "password"
            ? "text"
            : "password";

        password.type = type;

    });


    // Hiện / ẩn xác nhận mật khẩu

    toggleConfirmPassword.addEventListener("click", function () {

        const type =
            confirmPassword.type === "password"
            ? "text"
            : "password";

        confirmPassword.type = type;

    });

});

</script>

{% endblock %}

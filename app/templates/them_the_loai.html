{% extends 'layout/base.html' %}

{% block content %}

<div class="min-h-screen bg-slate-50 pt-28 pb-16">

    <div class="max-w-2xl mx-auto px-6">

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">

            <h1 class="text-2xl font-bold text-slate-800 mb-2">
                ➕ Thêm thể loại
            </h1>

            <p class="text-slate-500 mb-8">
                Tạo một thể loại sách mới
            </p>

            {% if message %}
            <div class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700">
                {{ message }}
            </div>
            {% endif %}

            <form method="POST">

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Tên thể loại
                    </label>

                    <input type="text"
                           name="ten_the_loai"
                           required
                           value="{{ request.form.get('ten_the_loai', '') }}"
                           class="w-full px-4 py-3 rounded-xl border border-slate-300"
                           placeholder="Ví dụ: Khoa học">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Mô tả
                    </label>

                    <textarea name="mo_ta"
                              rows="5"
                              class="w-full px-4 py-3 rounded-xl border border-slate-300"
                              placeholder="Mô tả về thể loại...">{{ request.form.get('mo_ta', '') }}</textarea>
                </div>

                <div class="flex gap-3">

                    <a href="{{ url_for('quan_ly_the_loai') }}"
                       class="flex-1 text-center px-5 py-3 rounded-xl border border-slate-300">
                        Hủy
                    </a>

                    <button type="submit"
                            class="flex-1 px-5 py-3 rounded-xl bg-primary text-white font-semibold">
                        Lưu thể loại
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
